# HTTPRoute for penpot, attached to the shared `public-gateway`.
# `sectionName: penpot-https` must match the listener name added by
# public-gateway-listener-patch.json.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: design-glia-org
  namespace: penpot
spec:
  hostnames:
    - design.glia.org
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
      namespace: ingress-nginx
      sectionName: penpot-https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: penpot
          port: 8080
          weight: 1
