# Server-side apply patch for the shared `public-gateway` (in ingress-nginx).
# Adds a single listener named `penpot-https` without touching listeners
# owned by moodle / hikma / mappinglandtheft / etc. The Gateway listeners
# field is `x-kubernetes-list-type: map` keyed by `name`, so server-side
# apply with field-manager isolation adds our listener and leaves the others
# under the control of their own field managers.
#
# Apply with:
#   kubectl apply --server-side --field-manager=penpot-kubernetes \
#     -f gateway/public-gateway-listener-patch.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: ingress-nginx
spec:
  gatewayClassName: nginx
  listeners:
    - name: penpot-https
      hostname: design.glia.org
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: design-glia-org-tls
            namespace: penpot
      allowedRoutes:
        namespaces:
          from: All
